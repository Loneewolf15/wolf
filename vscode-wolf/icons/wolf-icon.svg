<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Minimalist abstract wolf head -->
  <polygon points="50,90 20,40 30,10 50,30 70,10 80,40" fill="#2d2d2d" stroke="#fff" />
  <!-- Eyes -->
  <circle cx="40" cy="50" r="3" fill="#fff" stroke="none" />
  <circle cx="60" cy="50" r="3" fill="#fff" stroke="none" />
  <!-- Snout -->
  <polygon points="50,85 45,70 55,70" fill="#fff" stroke="none" />
</svg>
